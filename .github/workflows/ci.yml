name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore CDriveSmartClean.sln

      - name: Build
        run: dotnet build CDriveSmartClean.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CDriveSmartClean.sln --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format CDriveSmartClean.sln --verify-no-changes --no-restore
